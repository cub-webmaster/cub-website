name: GitHub Flow (Deploy Preview)

on:
  pull_request:
    branches: [live]
    types: [opened, synchronize, reopened]

jobs:
  # Preview deployment for Pull Requests
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # All-in-one deployment with automatic PR commenting
      - name: Deploy to Preview
        uses: harunonsystem/cf-workers-actions/preview-deploy@v1
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          worker-name: 'cub-website-preview-{pr-number}'
          domain: '{pr-number}.dry-meadow-02d4.workers.dev'
