name: Deploy Preview Site

on:
  pull_request:
    branches: [live]
    paths-ignore:
      - '.devcontainer/**'
      - 'documentation/**'
    types: [opened, synchronize, reopened]

jobs:
  # Preview deployment for Pull Requests
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 26.x
        uses: actions/setup-node@v4
        with:
          node-version: '26.x'
          cache: 'yarn'

      - name: Install and Build 🔧 # use the lockfile for reproducibility, run typechecking, then output to build folder
        env:
          GOOGLE_API_KEY: ${{ env.GOOGLE_API_KEY }}
        run: |
          yarn install
          yarn build
          touch .env
          echo 'GOOGLE_API_KEY=${{ env.GOOGLE_API_KEY }}' >> .env

      # Prepare preview deployment (generate URL and update wrangler.toml)
      - name: Prepare Preview Deployment
        id: prepare
        uses: harunonsystem/cf-workers-actions/prepare-preview-deploy@v1.2.1
        with:
          worker-name: 'cub-website-preview-${{ github.event.pull_request.number }}'
          environment: 'preview'
          domain: 'dry-meadow-02d4.workers.dev'

      - name: Deploy to Preview
        id: deploy
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -e preview --secrets-file .env

      # Comment on PR with deployment status
      - name: Comment on PR
        if: always()
        uses: harunonsystem/cf-workers-actions/pr-comment@v1.2.1
        with:
          deployment-url: ${{ steps.prepare.outputs.deployment-url }}
          deployment-success: ${{ steps.deploy.outcome == 'success' && 'true' || 'false' }}
          deployment-name: ${{ steps.prepare.outputs.deployment-name }}
